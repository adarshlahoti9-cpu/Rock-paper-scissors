
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rock Paper Scissors</title>
    <link rel="stylesheet" href="style.css">
    <script src="script.js" defer></script>
</head>
<body>

    <header class="header">
        <h1>Rock-Paper-Scissors</h1>
    </header>

    <main class="game">

        <section class="hands">

            <button class="hand-button" data-choice="rock">
                <span class="hand-circle">✊</span>
                <span class="hand-label">ROCK</span>
            </button>

            <button class="hand-button" data-choice="paper">
                <span class="hand-circle">✋</span>
                <span class="hand-label">PAPER</span>
            </button>

            <button class="hand-button" data-choice="scissors">
                <span class="hand-circle">✌️</span>
                <span class="hand-label">SCISSORS</span>
            </button>

        </section>

        <button class="pick-button" id="pickButton">
            Confirm
        </button>

        <section class="result-panel" aria-live="polite">

            <h2 id="result">Choose your move!</h2>

            <div class="score">
                <span>You: <b id="playerScore">0</b></span>
                <span>Computer: <b id="computerScore">0</b></span>
            </div>

            <p id="moves">Your move: — | Computer: —</p>

            <button id="resetButton" class="reset-button">
                Play Again ↻
            </button>

        </section>

    </main>

</body>
</html>
